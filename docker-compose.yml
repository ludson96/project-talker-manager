version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: talker_manager_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talker_manager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - talker_net

volumes:
  pgdata:

networks:
  talker_net:
    name: talker_manager_net
